
name: Source health check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue
        run: python scripts/validate_catalog.py
      - name: Check website reachability
        run: python scripts/health_check.py
      - name: Commit health report
        run: |
          if git diff --quiet -- health/status.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/status.json
          git commit -m "Update source health report"
          git push
          
